bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g history-limit 20000

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -s set-clipboard external
set -ag update-environment " WAYLAND_DISPLAY XDG_RUNTIME_DIR"
set -g escape-time 10

set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel '"$HOME/.local/bin/tmux-copy"'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel '"$HOME/.local/bin/tmux-copy"'

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n C-M-j switch-client -n
bind -n C-M-k switch-client -p

bind -n M-z resize-pane -Z

